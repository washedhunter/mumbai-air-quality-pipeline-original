[project]
name = "mumbai-air-quality-pipeline"
version = "0.1.0"
description = "Daily Airflow pipeline that loads Mumbai air-quality readings from OpenAQ into PostgreSQL, computes the CPCB National AQI with SQL models, forecasts 7-day AQI with Prophet and feeds a Power BI dashboard."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kaif Attarwala" }]
requires-python = ">=3.12,<3.13"
# Versions stay inside Airflow 3.4.0's constraints (pandas 3.1.0, numpy 2.5.4, psycopg 3.3.6, httpx 0.28.1)
# so the same package installs cleanly into the Airflow image.
dependencies = [
    "httpx>=0.28,<0.29",
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    "psycopg[binary]>=3.3,<4",
    "prophet>=1.5,<2",
    "typer>=0.27",
]

[project.scripts]
aq = "mumbai_aq.cli:app"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mumbai_aq"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "mumbai_aq/sql"
"config" = "mumbai_aq/config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]  # B008: typer declares options as argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: needs a PostgreSQL database (set TEST_WAREHOUSE_DSN); skipped otherwise",
    "airflow: needs apache-airflow installed (runs inside the Airflow image)",
]
filterwarnings = [
    # prophet 1.5 still uses DataFrame.drop(inplace=True); harmless until pandas 4
    "ignore:The inplace keyword:DeprecationWarning",
    "ignore:The inplace keyword:FutureWarning",
    "ignore::pandas.errors.Pandas4Warning",
]
